# Nonsecret configuration. Paths are relative to the project root.
data_dir: data
source_registry: config/sources.yaml
log_level: INFO
fetch:
  timeout_seconds: 20
  max_retries: 2
  max_redirects: 5
  max_html_bytes: 5242880
  max_pdf_bytes: 62914560
embedding:
  model_name: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
chunking:
  tokenizer_model_name: intfloat/e5-base-v2  # Historical Phase 2 chunk identities remain immutable.
  tokenizer_revision: f52bf8ec8c7124536f0efb74aca902b2995e5bcd
  target_tokens: 350
  overlap_tokens: 50
runtime:
  question_max_characters: 2000
  selected_document_limit: 20
  candidate_chunks: 20
  per_document_candidates: 3
  request_timeout_seconds: 60
generation:
  provider: groq
  model_name: openai/gpt-oss-120b
policy:
  classifier: local_conservative_v1
  minimum_confidence: 0.9
  classifier_timeout_seconds: 10
answering:
  generator: configured
  units_per_aspect: 1
  max_claims_per_document: 8
  repair_attempts: 1
  semantic_minimum_confidence: 0.95
  generator_timeout_seconds: 30
  verifier_timeout_seconds: 15
# Local rolling budgets; adjust to your Groq account limits.
groq:
  max_input_tokens: 6000
  max_completion_tokens: 1024
  requests_per_minute: 30
  requests_per_hour: 60
  requests_per_day: 300
  tokens_per_minute: 8000
  tokens_per_hour: 30000
  tokens_per_day: 100000
api:
  max_body_bytes: 16384
  max_in_flight: 2
